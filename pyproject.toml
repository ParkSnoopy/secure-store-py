[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "secure-store-py"
dynamic = ["version"]
description = "Native local vaults for Python API keys"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"

[project.optional-dependencies]
nuitka = [
    "nuitka>=4.3,<5",
    "patchelf; sys_platform == 'linux'",
    "zstandard",
]

[project.urls]
Repository = "https://github.com/ParkSnoopy/secure-store-py"

[tool.maturin]
manifest-path = "modules/py/Cargo.toml"
python-source = "python"
module-name = "secure_store._native"
