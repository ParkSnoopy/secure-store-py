[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "secure-store-py"
dynamic = ["version"]
description = "Native local vaults for Python API keys"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"

[project.urls]
Repository = "https://github.com/ParkSnoopy/secure-store-py"

[tool.maturin]
manifest-path = "modules/python/Cargo.toml"
module-name = "secure_store"
